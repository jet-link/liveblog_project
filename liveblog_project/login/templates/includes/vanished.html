{% extends 'base.html' %}
{% load static %}
{% load counters %}
{% block title %}
  Vanished user
{% endblock %}

{% block content %}
  <div class="container content_block">
    {% include 'includes/breadcrumbs.html' %}

    <div class="text-center py-5">
      <div class="vanished-avatar-wrap">
        <img src="{% static 'img/user-deleted.webp' %}" alt="Vanished user" loading="eager" decoding="async" />
      </div>
      <h4 class="text-muted m-0">Vanished user</h4>
      <p class="text-muted small mt-2">User has been removed.</p>
    </div>
  </div>
{% endblock %}
