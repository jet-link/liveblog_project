{% extends 'admin/layout/base.html' %}
{% block title %}Delete FAQ{% endblock %}
{% block page_title %}Delete FAQ{% endblock %}
{% block content %}
<div class="admin-card admin-modal-card">
    <h3>Delete "{{ item.question|truncatewords:10 }}"?</h3>
    <form method="post" class="admin-form-actions">{% csrf_token %}<button type="submit" class="admin-button admin-button-danger">Delete</button><a href="{% url 'admin_panel:faq_list' %}" class="admin-button admin-button-outline">Cancel</a></form>
</div>
{% endblock %}
