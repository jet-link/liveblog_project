{% extends 'admin/layout/base.html' %}

{% block title %}Delete Comment{% endblock %}
{% block page_title %}Delete Comment{% endblock %}

{% block content %}
<div class="admin-card admin-modal-card">
    <h3>Delete comment?</h3>
    <p>{{ comment.text|truncatewords:30 }}</p>
    <form method="post" class="admin-form-actions">
        {% csrf_token %}
        <button type="submit" class="admin-button admin-button-danger">Delete</button>
        <a href="{% url 'admin_panel:comments_list' %}" class="admin-button admin-button-outline">Cancel</a>
    </form>
</div>
{% endblock %}
