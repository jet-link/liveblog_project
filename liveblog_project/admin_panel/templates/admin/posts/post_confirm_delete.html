{% extends 'admin/layout/base.html' %}

{% block title %}Delete Post{% endblock %}
{% block page_title %}Delete Post{% endblock %}

{% block content %}
<div class="admin-card admin-modal-card">
    <h3>Delete "{{ item.title }}"?</h3>
    <p>This action cannot be undone.</p>
    <form method="post" class="admin-form-actions">
        {% csrf_token %}
        <button type="submit" class="admin-button admin-button-danger">Delete</button>
        <a href="{% url 'admin_panel:posts_list' %}" class="admin-button admin-button-outline">Cancel</a>
    </form>
</div>
{% endblock %}
