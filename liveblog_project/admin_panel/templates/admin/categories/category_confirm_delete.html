{% extends 'admin/layout/base.html' %}
{% block title %}Delete Category{% endblock %}
{% block page_title %}Delete {{ category.name }}?{% endblock %}
{% block content %}
<div class="admin-card admin-modal-card">
    <h3>Delete category "{{ category.name }}"?</h3>
    <form method="post" class="admin-form-actions">{% csrf_token %}<button type="submit" class="admin-button admin-button-danger">Delete</button><a href="{% url 'admin_panel:categories_list' %}" class="admin-button admin-button-outline">Cancel</a></form>
</div>
{% endblock %}
