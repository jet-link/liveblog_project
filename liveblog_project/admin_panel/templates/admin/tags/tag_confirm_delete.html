{% extends 'admin/layout/base.html' %}
{% block title %}Delete Tag{% endblock %}
{% block page_title %}Delete {{ tag.tag_name }}?{% endblock %}
{% block content %}
<div class="admin-card admin-modal-card">
    <h3>Delete tag "{{ tag.tag_name }}"?</h3>
    <form method="post" class="admin-form-actions">{% csrf_token %}<button type="submit" class="admin-button admin-button-danger">Delete</button><a href="{% url 'admin_panel:tags_list' %}" class="admin-button admin-button-outline">Cancel</a></form>
</div>
{% endblock %}
