{% extends 'admin/layout/base.html' %}
{% block title %}Unban User{% endblock %}
{% block page_title %}Unban {{ user_obj.username }}?{% endblock %}
{% block content %}
<div class="admin-card admin-modal-card">
    <h3>Unban user "{{ user_obj.username }}"?</h3>
    <form method="post" class="admin-form-actions">{% csrf_token %}<button type="submit" class="admin-button admin-button-primary">Unban</button><a href="{% url 'admin_panel:users_list' %}" class="admin-button admin-button-outline">Cancel</a></form>
</div>
{% endblock %}
