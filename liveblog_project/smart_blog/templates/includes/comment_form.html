{% if user.is_authenticated %}
  <div class="d-flex gap-4 align-items-center justify-content-between pt-4 mb-4">
    <h5 class="text-muted m-0">Write a comment</h5>
  </div>

  <form id="commentForm" action="{% url 'smart_blog:add_comment' item.slug %}" method="post" novalidate data-validate="true" data-ajax="true" data-item-id="{{ item.pk }}" class="pb-4">
    {% csrf_token %}

    <div id="commentFormErrors" class="mb-2"></div>

    <div class="form-floating mb-2">
      {{ form.text }}
      <label for="id_comment_text">Comment here</label>
    </div>

    <button id="submitCommentBtn" type="submit" class="cstm-btn custom-primary-btn comment-btn">Comment</button>
    <button id="clearComment" type="button" class="btn btn-link text-decoration-none btn-sm hidden success_" aria-label="Clear comment">Clear</button>
  </form>
{% endif %}
