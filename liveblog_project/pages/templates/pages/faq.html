{% extends 'base.html' %}
{% load static %}
{% block title %}
  FAQ
{% endblock %}

{% block content %}
  <section class="faq-section">
    <div class="container">
      <div class="faq_accordion">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="text-muted m-0">FAQ</h4>
          {% if user.is_authenticated and not user.is_staff %}
          <button type="button" class="cstm-btn custom-primary-btn">Send question</button>
          {% endif %}
        </div>
        <div class="accordion" id="faqAccordion">
          {% for item in faq_items %}
            <div class="accordion-item">
              <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ item.id }}" aria-expanded="false" aria-controls="faq{{ item.id }}">{{ item.question }}</button></h2>
              <div id="faq{{ item.id }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body faq_answer">{{ item.answer }}</div>
              </div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </section>
{% endblock %}
