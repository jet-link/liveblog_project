<!-- overlay menu -->
<div id="bottomMenuOverlay" class="bottom-menu-overlay hidden"></div>
<aside id="bottomSideMenu" class="bottom-side-menu hidden" aria-hidden="true" inert>
  <div class="bottom-menu-header d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <div class="bottom-left-nav header-brand">
        <a href="/" class="brand-minimal">BrainStorm</a>
      </div>
      <button type="button" class="theme-toggle-btn theme-toggle-overlay p-0" aria-label="Toggle theme" title="Light/Dark theme"><i class="fa fa-moon-o theme-toggle-icon" aria-hidden="true"></i></button>
    </div>
    <button id="bottomMenuClose" class="text-muted p-0" aria-label="Close menu">×</button>
  </div>

  <nav class="bottom-menu-nav">
    {% with nav_name=request.resolver_match.url_name|default:'' %}
    <a href="{% url 'smart_blog:items_list' %}" class="header-menu-item text-decoration-none text-muted{% if nav_name == 'items_list' %} active{% endif %}">BraiNews</a>
    <a href="{% url 'smart_blog:for_you_list' %}" class="header-menu-item text-decoration-none text-muted{% if nav_name == 'for_you_list' %} active{% endif %}">For you</a>
    <a href="{% url 'smart_blog:trending_list' %}" class="header-menu-item text-decoration-none text-muted{% if nav_name == 'trending_list' %} active{% endif %}">In trend</a>
    <a href="{% url 'smart_blog:topics_list' %}" class="header-menu-item text-decoration-none text-muted{% if nav_name == 'topics_list' or nav_name == 'topic_detail' %} active{% endif %}">Topics</a>
    {% endwith %}
  </nav>

 <nav class="social-block">
    <span class="text-muted">Subscribe to us</span>
    <hr />
    <div class="social-nav">
      <a href="#"><i class="fa fa-twitter"></i></a>
      <a href="#"><i class="fa fa-facebook"></i></a>
      <a href="#"><i class="fa fa-paper-plane"></i></a>
      <a href="#"><i class="fa fa-instagram"></i></a>
    </div>
  </nav>
</aside>
