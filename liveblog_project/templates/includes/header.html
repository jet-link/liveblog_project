<header class="header">
  <div class="container">
    <nav class="nav justify-content-between align-items-center">
      <div class="bottom-left-nav d-flex align-items-center gap-4">
        <a class="nav-link text-muted fs-5" href="/">BrainStorm</a>
      </div>
      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          <div class="user-menu" id="userMenu">
            <a href="{% url 'login_app:profile' user.username %}" class="text-decoration-none user-avatar-btn">{% include 'includes/thumb_avatar.html' with user=user %}</a>

            <div class="user-tooltip">
              <a href="{% url 'login_app:profile' user.username %}" class="text-muted"><i class="fa fa-user-circle-o me-2" aria-hidden="true"></i>View profile</a>
              <a href="{% url 'login_app:profile-edit' request.user.username %}" class="text-muted"><i class="fa fa-cog me-2" aria-hidden="true"></i>Edit profile</a>
              <a href="{% url 'smart_blog:create_item' %}" class="text-muted"><i class="fa fa-plus me-2"></i>Create item</a>
              <div class="divider"></div>
              <a href="{% url 'login_app:logout' %}" class="danger"><i class="fa fa-sign-out me-2" aria-hidden="true"></i>Logout</a>
            </div>
          </div>
        <a href="{% url 'login_app:notifications' user.username %}" class="text-muted text-decoration-none fs-5 notification-btn">
          {% if notifications_count_label %}
            <span class="notifications-count">{{ notifications_count_label }}</span>
          {% endif %}
          <i class="fa fa-bell-o" aria-hidden="true"></i>
        </a>
        {% else %}
          <a href="{% url 'login_app:login' %}" class="text-muted text-decoration-none fw-semibold">Login</a>
        {% endif %}
        <button id="bottomBurgerBtn" class="bottom-burger" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>
  </div>
</header>
{% include 'includes/overlay-menu.html' %}
